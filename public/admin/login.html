<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>অ্যাডমিন লগইন — মুক্তপাঠ</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<div class="container login-wrap">
  <h1 style="text-align:center;color:var(--green-900);margin-bottom:6px">মুক্তপাঠ অ্যাডমিন</h1>

  <!-- প্রথম সেটআপ (কোনো অ্যাডমিন না থাকলে দেখায়) -->
  <div class="form-card" id="setup-card" style="display:none">
    <h2>প্রথম অ্যাডমিন তৈরি করুন</h2>
    <p style="color:var(--muted)">সার্ভারে সেট করা SETUP_TOKEN লাগবে (README দেখুন)।</p>
    <form id="setup-form">
      <label>SETUP_TOKEN</label><input name="setup_token" required type="password">
      <label>অ্যাডমিন ইমেইল</label><input name="email" required type="email">
      <label>পাসওয়ার্ড (অন্তত ১০ অক্ষর)</label><input name="password" required type="password" minlength="10">
      <p style="margin-top:16px"><button class="btn" type="submit">অ্যাডমিন তৈরি করুন</button></p>
      <div class="form-msg" id="setup-msg"></div>
    </form>
  </div>

  <div class="form-card" id="login-card">
    <h2>লগইন</h2>
    <form id="login-form">
      <label>ইমেইল</label><input name="email" required type="email">
      <label>পাসওয়ার্ড</label><input name="password" required type="password">
      <p style="margin-top:16px"><button class="btn btn-green" type="submit" style="width:100%">লগইন করুন</button></p>
      <div class="form-msg" id="login-msg"></div>
    </form>
  </div>
  <p style="text-align:center;margin-top:14px"><a href="/">← সাইটে ফিরুন</a></p>
</div>
<script src="/assets/js/admin.js"></script>
<script>
function msg(id, text, ok) {
  const el = document.getElementById(id);
  el.textContent = text; el.className = 'form-msg ' + (ok ? 'ok' : 'err');
}
(async () => {
  try {
    const me = await fetch('/api/admin/me').then((r) => r.json());
    if (me.admin) { location.href = '/admin/'; return; }
    if (!me.has_admin) document.getElementById('setup-card').style.display = 'block';
  } catch { /* ignore */ }
})();
document.getElementById('setup-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const obj = Object.fromEntries(new FormData(e.target));
  try {
    const d = await apiSend('/api/admin/setup', 'POST', obj);
    msg('setup-msg', d.message, true);
    document.getElementById('setup-card').style.display = 'none';
  } catch (err) { msg('setup-msg', err.message, false); }
});
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const obj = Object.fromEntries(new FormData(e.target));
  try {
    await apiSend('/api/admin/login', 'POST', obj);
    location.href = '/admin/';
  } catch (err) { msg('login-msg', err.message, false); }
});
</script>
</body>
</html>
